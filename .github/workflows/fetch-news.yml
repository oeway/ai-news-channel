name: Fetch & Publish AI News

on:
  schedule:
    - cron: '0 7 * * *'   # Daily at 07:00 UTC
  workflow_dispatch:       # Manual trigger via GitHub UI

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest AI news
        run: python scripts/fetch_news.py

      - name: Commit & push updated newsletter
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: AI Pulse newsletter — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin ${{ github.ref_name }}
          fi
