name: Fetch AI News & Update Newsletter

on:
  schedule:
    - cron: '0 7 * * *'   # Daily at 07:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch AI news & generate newsletter
        run: python scripts/fetch_news.py

      - name: Commit & push updated newsletter
        run: |
          git config user.name  "AI Pulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/state.json
          if git diff --cached --quiet; then
            echo "No changes to commit — newsletter is up to date"
          else
            git commit -m "chore: newsletter update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD
            echo "Newsletter updated and pushed"
          fi
