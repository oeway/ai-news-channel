name: Fetch & Publish AI News

on:
  schedule:
    - cron: '0 7 * * *'   # daily at 07:00 UTC
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest AI news
        run: python scripts/fetch_news.py

      - name: Commit updated newsletter
        run: |
          git config user.name  "AI Pulse Bot"
          git config user.email "ai-pulse-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: daily AI news update $(date -u +'%Y-%m-%d')"
          git push origin main

  deploy-pages:
    needs: fetch-and-deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
