name: Update AI News Newsletter

on:
  schedule:
    # Runs daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable verbose output'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and render newsletter
        run: python scripts/fetch_news.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/index.html docs/state.json 2>/dev/null \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit updated newsletter
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/state.json
          git commit -m "chore: update AI Pulse newsletter [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push origin HEAD

      - name: No new content
        if: steps.changes.outputs.changed == 'false'
        run: echo "No changes detected — newsletter is already up to date."
