name: Update AI News Newsletter

on:
  schedule:
    # Run daily at 07:00 UTC (early morning, so news is ready for the day)
    - cron: '0 7 * * *'
  workflow_dispatch:   # Allow manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-newsletter:
    name: Fetch & Render Newsletter
    runs-on: ubuntu-latest
    concurrency:
      group: newsletter-update
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        run: python scripts/fetch_news.py

      - name: Commit updated newsletter
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes – newsletter is already up to date."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "📰 Update AI newsletter · $DATE [skip ci]"
            git push
          fi

  # Deploy to GitHub Pages after the newsletter is committed
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: update-newsletter
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # always deploy from main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
