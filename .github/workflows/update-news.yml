name: Update AI News Newsletter

on:
  schedule:
    # Run daily at 07:00 UTC so the digest is ready each morning
    - cron: '0 7 * * *'
  workflow_dispatch:    # Manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: newsletter-update
  cancel-in-progress: false

jobs:
  update-newsletter:
    name: Fetch & Render Newsletter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        run: python scripts/fetch_news.py

      - name: Commit updated newsletter
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes – newsletter is already up to date."
          else
            git commit -m "chore: refresh AI Pulse newsletter [skip ci]"
            git push origin HEAD:main
          fi
