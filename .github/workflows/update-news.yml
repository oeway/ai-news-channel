name: Update AI News Newsletter

on:
  schedule:
    # Run daily at 07:00 UTC so the digest is ready each morning
    - cron: '0 7 * * *'
  workflow_dispatch:    # Manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  update-newsletter:
    name: Fetch & Render Newsletter
    runs-on: ubuntu-latest
    concurrency:
      group: newsletter-update
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        run: python scripts/fetch_news.py

      - name: Commit updated newsletter
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes – newsletter is already up to date."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "📰 Update AI newsletter · $DATE"
            git push
          fi
