name: Update AI News Daily

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest AI news & regenerate newsletter
        run: python scripts/fetch_news.py

      - name: Commit & push updated newsletter
        run: |
          git config user.name  "AI Pulse Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/state.json
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            ISSUE=$(python -c "import json; print(json.load(open('docs/state.json'))['issue'])")
            git commit -m "chore: AI Pulse Issue #${ISSUE} — $(date -u +'%Y-%m-%d')"
            git push origin main
          fi
