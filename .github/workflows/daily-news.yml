name: 📰 Daily AI News Update

on:
  schedule:
    # 07:00 UTC every day
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest AI news
        run: python scripts/fetch_news.py

      - name: Commit and push
        run: |
          git config user.name  "AI Pulse Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes — newsletter is already up to date."
          else
            DATE=$(date -u +'%Y-%m-%d')
            git commit -m "📰 AI news update ${DATE}"
            git push
          fi
