name: Update AI News Newsletter

on:
  schedule:
    # Every day at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and render newsletter
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/state.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          issue=$(python -c "import json; print(json.load(open('docs/state.json'))['issue'])")
          git commit -m "chore: publish newsletter issue #${issue}"
          git push origin HEAD:main
