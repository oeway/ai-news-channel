name: Update AI Newsletter

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 7:00 AM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser requests

      - name: Fetch latest AI news
        run: python scripts/fetch_news.py

      - name: Commit updated newsletter
        run: |
          git config user.name "AI Pulse Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update newsletter — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "AI Pulse Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save docs content
          cp -r docs /tmp/docs-deploy
          # Switch to orphan gh-pages
          git checkout --orphan gh-pages-tmp 2>/dev/null || git checkout -b gh-pages-tmp
          git rm -rf . --quiet
          cp -r /tmp/docs-deploy/. .
          [ -f .nojekyll ] || touch .nojekyll
          git add -A
          git commit -m "deploy: newsletter $(date -u '+%Y-%m-%d %H:%M UTC')" --allow-empty
          git push origin HEAD:gh-pages --force
          git checkout main
