name: Update AI News Newsletter

on:
  schedule:
    - cron: '0 7 * * *'   # daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-newsletter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and regenerate newsletter
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/; then
            echo "No changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add docs/index.html docs/state.json
          git commit -m "chore: refresh AI Pulse newsletter [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Runs in the same workflow run as `update`, so it isn't a `push`-triggered
  # workflow — commits made with the default GITHUB_TOKEN don't fire other
  # workflows' `push` events, which previously left deploy-pages.yml (and the
  # live site) silently stuck days behind main after every automated refresh.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          STAGE=$(mktemp -d)
          cp -r docs/. "$STAGE"/
          git checkout --orphan gh-pages-tmp
          git rm -rf .
          cp -r "$STAGE"/. .
          git add -A
          git commit -m "Deploy docs to GitHub Pages"
          git push origin HEAD:gh-pages --force
