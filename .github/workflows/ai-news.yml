name: AI News — Fetch & Publish

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day
  workflow_dispatch:        # manual trigger from the GitHub Actions UI
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: ai-news
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch & generate newsletter
        run: python scripts/fetch_news.py

      - name: Commit updated newsletter to main
        run: |
          git config user.name  "AI Pulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/state.json
          if git diff --staged --quiet; then
            echo "No new articles — newsletter unchanged."
          else
            git commit -m "newsletter: daily update $(date -u +'%Y-%m-%d')"
            git push origin HEAD
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: |
          # Stash the generated docs outside the repo working tree
          cp -r docs /tmp/gh-pages-content

          # Build an orphan snapshot — no history on the Pages branch
          git checkout --orphan _deploy-tmp
          git rm -rf . 2>/dev/null || true

          # Populate root of Pages branch from docs/
          cp -r /tmp/gh-pages-content/. .

          git add -A
          git commit -m "pages: AI Pulse $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --allow-empty
          git push origin HEAD:gh-pages --force
