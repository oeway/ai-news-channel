name: Fetch AI News & Deploy

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 07:00 UTC
  workflow_dispatch:        # Also triggerable manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch latest AI news and generate newsletter
        run: python scripts/fetch_news.py

      - name: Commit updated newsletter
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Only commit if there are actual changes
          git diff --staged --quiet && echo "Nothing changed, skipping commit." || \
            git commit -m "chore: auto-update AI newsletter $(date -u +%Y-%m-%d)"

      - name: Push to main
        run: git push origin main

  deploy:
    needs: fetch-news
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main    # Pull the freshly committed docs/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy docs to gh-pages branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages-tmp
          git rm -rf .
          cp -r docs/* .
          cp docs/.nojekyll . 2>/dev/null || true
          git add -A
          git commit -m "Deploy newsletter $(date -u +%Y-%m-%d)"
          git push origin HEAD:gh-pages --force
