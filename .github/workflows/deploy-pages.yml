name: Update AI News Newsletter

on:
  schedule:
    # Daily at 07:00 UTC
    - cron: '0 7 * * *'
  push:
    branches: [main]
    paths-ignore:
      # Avoid re-triggering when the bot commits docs/
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        run: python scripts/fetch_news.py

      - name: Commit generated newsletter to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: AI newsletter update $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
          fi

      - name: Deploy to gh-pages branch
        run: |
          # Copy the freshly generated site to a temp location first
          cp -r docs /tmp/site-deploy

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan gh-pages-tmp
          git rm -rf .

          # Restore the generated site
          cp -r /tmp/site-deploy/. .
          touch .nojekyll

          git add -A
          git diff --cached --quiet || \
            git commit -m "Deploy newsletter $(date -u '+%Y-%m-%d')"
          git push origin HEAD:gh-pages --force
