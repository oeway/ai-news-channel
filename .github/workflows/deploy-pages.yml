name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        run: |
          # Stage docs/ to a temp dir FIRST — `git rm -rf .` below wipes the
          # working tree (not just the git index), so if we copy from docs/
          # after the orphan checkout, `cp -r docs/*` fails with
          # "No such file or directory" (this broke every deploy for 2 months).
          STAGE=$(mktemp -d)
          cp -r docs/. "$STAGE"/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf .
          cp -r "$STAGE"/. .
          touch .nojekyll
          git add -A
          git commit -m "Deploy docs to GitHub Pages"
          git push origin HEAD:gh-pages --force
