name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:
  workflow_run:
    # Commits made by the newsletter-update workflow use the default
    # GITHUB_TOKEN, which does not trigger the `push` event above — so we
    # also deploy whenever that workflow finishes successfully.
    workflows: ['Update AI News Newsletter']
    types: [completed]

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf .
          cp -r docs/* .
          cp docs/.nojekyll . 2>/dev/null || true
          git add -A
          git commit -m "Deploy docs to GitHub Pages"
          git push origin HEAD:gh-pages --force
