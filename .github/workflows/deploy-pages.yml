name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage docs/ outside the repo first: `git rm -rf .` below deletes
          # tracked files (and now-empty dirs, including docs/) from the
          # working tree, not just the index, so `cp -r docs/*` after it
          # would fail with "No such file or directory".
          staging="$(mktemp -d)"
          cp -r docs/. "$staging"/
          git checkout --orphan gh-pages-tmp
          git rm -rf .
          cp -r "$staging"/. .
          git add -A
          git commit -m "Deploy docs to GitHub Pages"
          git push origin HEAD:gh-pages --force
