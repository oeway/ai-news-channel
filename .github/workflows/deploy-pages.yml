name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs → GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Try the modern Pages API first ──────────────────────────────────────
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy via Pages API
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      # ── Fallback: orphan gh-pages branch ────────────────────────────────────
      - name: Fallback — push to gh-pages branch
        if: steps.pages.outcome != 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git checkout --orphan gh-pages-tmp
          git rm -rf .
          cp -r docs/. .
          cp docs/.nojekyll . 2>/dev/null || true
          git add -A
          git commit -m "🚀 Deploy AI Pulse newsletter — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:gh-pages --force
          echo "✅ Deployed to gh-pages branch (fallback)."
