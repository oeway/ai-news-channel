name: Update & Deploy AI News Newsletter

on:
  schedule:
    - cron: '0 7 * * *'   # daily at 07:00 UTC
  workflow_dispatch:        # manual trigger via Actions UI
  push:
    branches: [main]
    paths:
      - 'scripts/**'        # re-run when scraper logic changes

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news & generate newsletter
        run: python scripts/fetch_news.py

      - name: Commit updated newsletter to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update newsletter $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          else
            echo "No content changes — skipping commit"
          fi

      - name: Deploy docs/ to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save docs/ contents before switching branches
          cp -r docs /tmp/gh-deploy

          # Create a clean orphan branch for gh-pages
          git checkout --orphan gh-pages-tmp
          git rm -rf . --quiet 2>/dev/null || true

          # Restore docs/ contents at the repo root
          cp -r /tmp/gh-deploy/. .  2>/dev/null || true
          # Ensure .nojekyll is at root so GitHub doesn't run Jekyll
          touch .nojekyll

          git add -A
          git commit -m "Deploy: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:gh-pages --force
