name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage docs/ to a temp dir BEFORE the orphan checkout wipes the
          # working tree — `git checkout --orphan` + `git rm -rf .` removes
          # files from disk, not just the index, so docs/ would be empty
          # by the time `cp -r docs/*` ran otherwise.
          STAGE=$(mktemp -d)
          cp -r docs/. "$STAGE"/

          git checkout --orphan gh-pages-tmp
          git rm -rf .
          cp -r "$STAGE"/. .
          rm -rf "$STAGE"
          git add -A
          git commit -m "Deploy docs to GitHub Pages"
          git push origin HEAD:gh-pages --force
