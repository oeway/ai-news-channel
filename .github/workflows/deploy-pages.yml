name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy docs/ to gh-pages branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the docs content
          TMPDIR=$(mktemp -d)
          cp -r docs/. "$TMPDIR/"

          # Switch to / create gh-pages branch
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Wipe tree and restore docs content
          git rm -rf . --quiet || true
          cp -r "$TMPDIR"/. .

          # Ensure Jekyll bypass is present
          touch .nojekyll

          git add -A
          git diff --staged --quiet && echo "Nothing to deploy" && exit 0
          git commit -m "Deploy to GitHub Pages [skip ci]"
          git push origin gh-pages --force
